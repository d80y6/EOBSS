name: CI - Go Services

on:
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'libs/go-common/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'libs/go-common/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: Build and Test
      run: |
        for dir in services/*/ ; do
          if [ -f "\$dir/go.mod" ]; then
            echo "Building \$dir..."
            cd \$dir
            go build ./...
            go test ./...
            cd ../..
          fi
        done
