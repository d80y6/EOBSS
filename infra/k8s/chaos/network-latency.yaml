apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: billing-latency
  namespace: chaos-testing
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - telcoflow
    labelSelectors:
      app: billing-service
  delay:
    latency: "200ms"
    correlation: "100"
    jitter: "10ms"
  duration: "10m"
